# llama-server router-mode model preset.
#
# Install location: /etc/workstation/llama-router.ini
# Owner: root, mode 0644 (world-readable; no secrets, just flag values).
# Read by: llama-primary-router.service via --models-preset.
#
# Each [section] declares a swappable model. The section name is the
# model id at the API level (what you put in `model` on /v1/chat/completions
# and what `--alias` would set if loading directly). Keys are llama-server
# CLI flag names without the leading --; values are flag arguments.
# Boolean flags accept on/true.
#
# All flags here have been validated against the production unit-based
# stacks they replace; see docs/research/2026-05-03-router-mode-validation.md
# for the bench data confirming both models load and serve correctly via
# this preset on the HIP build.
[glm-4.7-flash]
# 30B param dense, Q4_K_XL, 64K context, fully GPU-resident. Faster
# default for short tasks and quick iteration. On the HIP build this
# reaches ~72 tok/s gen vs ~30 tok/s on the Vulkan build it replaces
# (see router-mode-validation.md).
model = /var/lib/llama-models/glm-4.7-flash/GLM-4.7-Flash-UD-Q4_K_XL.gguf
alias = glm-4.7-flash
n-gpu-layers = 99
ctx-size = 65536
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
# Sampler from Z.AI / unsloth recommended params. min-p = 0.01 added as
# long-session safety net consistent with the OSS config.
temp = 0.7
top-p = 1.0
min-p = 0.01

[qwen3-coder-30b]
# Qwen3-Coder-30B-A3B-Instruct: 30.5B MoE / 3.3B active. Fully GPU-resident
# at Q4_K_XL on the 7900 XTX (~18 GiB weights + KV at 64K). Trained for
# coding agents; SWE-Bench Verified ~50% Pass@1 (third-party).
#
# CRITICAL: reasoning-format = none. llama.cpp's default (--jinja-implied
# deepseek extraction) wrongly tags Qwen3-Coder responses as thinking and
# stuffs them into message.reasoning_content, which opencode's openai-
# compatible adapter does not render. Setting reasoning-format=none keeps
# any <think> text inline in message.content. See ggml-org/llama.cpp#20809
# and sst/opencode#24130.
#
# Sampler values from Qwen team's official model card.
model = /var/lib/llama-models/qwen3-coder-30b-a3b-instruct/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf
alias = qwen3-coder-30b
n-gpu-layers = 999
ctx-size = 65536
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
reasoning-format = none
# Qwen-recommended sampler for Instruct/Coder variants.
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
repeat-penalty = 1.05
presence-penalty = 1.5
[qwen3-next-80b-thinking]
# Qwen3-Next-80B-A3B-Thinking: 80B MoE / 3B active, hybrid Gated DeltaNet.
# 96K context. n-cpu-moe=28 -- 20 layers on GPU + 28 expert layers in DDR4.
# GPU footprint ~22 GiB at 96K context.
#
# CRITICAL: reasoning-format = none. Otherwise llama.cpp extracts <think>
# blocks into message.reasoning_content, leaving message.content empty
# until the model finishes thinking. opencode renders only content, so
# Thinking responses appear silent. With reasoning-format=none the
# <think>...</think> text stays in content; user sees the reasoning,
# which is the thinking-model UX anyway. See ggml-org/llama.cpp#20809.
#
# presence-penalty=1.5 per Qwen card to prevent thinking-loop runaway.
# (Without it, model can get stuck deliberating "how many words is 'hi'"
# for thousands of tokens.)
model = /var/lib/llama-models/qwen3-next-80b-a3b-thinking/Qwen3-Next-80B-A3B-Thinking-UD-Q4_K_XL.gguf
alias = qwen3-next-80b-thinking
n-gpu-layers = 999
n-cpu-moe = 28
ctx-size = 98304
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 1024
ubatch-size = 1024
cache-reuse = 256
jinja = true
reasoning-format = deepseek
# Cap thinking-trace length so the model is forced to emit </think>
# and produce content even on prompts that drive long deliberation.
# 4096 is generous for hard reasoning while preserving budget for output.
reasoning-budget = 4096
# Qwen-recommended sampler for Thinking variant.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 1.5
[qwen3-next-80b-instruct]
# Qwen3-Next-80B-A3B-Instruct (non-thinking sibling). Same arch as Thinking;
# weights and sampler differ. Already on disk from 2026-04-23. Kept for
# agent loops where reasoning traces are noise.
#
# Same llama.cpp false-thinking-detection problem as Coder-30B: without
# reasoning-format=none, output gets stuffed into reasoning_content and
# opencode renders nothing.
model = /var/lib/llama-models/qwen3-next-80b-a3b-instruct/Qwen3-Next-80B-A3B-Instruct-UD-Q4_K_XL.gguf
alias = qwen3-next-80b-instruct
n-gpu-layers = 999
n-cpu-moe = 28
ctx-size = 98304
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 1024
ubatch-size = 1024
cache-reuse = 256
jinja = true
reasoning-format = none
# Qwen-recommended sampler for Instruct (non-thinking).
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
repeat-penalty = 1.05
presence-penalty = 1.5
